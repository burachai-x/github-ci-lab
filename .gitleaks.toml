# คอนฟิกของ Gitleaks — ด่าน Secret Scanning
#
# useDefault = true คือหยิบกฎมาตรฐานกว่า 200 ข้อของ Gitleaks มาใช้ทั้งชุด
# (AWS, Google, Slack, Stripe, GitHub token, private key ฯลฯ) แล้วเราค่อย "ต่อเติม" ข้างล่าง

title = "github-ci-lab — กติกาการตรวจค่าลับ"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# กฎที่เขียนเพิ่มเอง
#
# ของสำคัญที่สุดที่หลายทีมลืม: token รูปแบบเฉพาะขององค์กรตัวเอง
# เครื่องมือสำเร็จรูปไม่มีทางรู้จัก เราต้องสอนมันเอง
# ---------------------------------------------------------------------------

[[rules]]
id = "gbtech-internal-token"
description = "โทเคนของระบบภายใน (ขึ้นต้นด้วย gbt_live_ หรือ gbt_test_)"
regex = '''gbt_(?:live|test)_[0-9a-zA-Z]{24,}'''
keywords = ["gbt_live_", "gbt_test_"]
tags = ["internal", "token"]

[rules.allowlist]
# ค่า placeholder ที่ใช้ในเอกสารและเทส ไม่ต้องเตือน
regexes = ['''gbt_(?:live|test)_x{24,}''']

[[rules]]
id = "thai-bank-account-in-code"
description = "เลขบัญชีธนาคารที่เขียนติดมากับโค้ด"
regex = '''(?i)(?:bank_?account|acc(?:ount)?_?no)\s*[:=]\s*['"]?\d{10,15}['"]?'''
keywords = ["bank_account", "account_no", "accountNo"]
tags = ["pii"]

# ---------------------------------------------------------------------------
# ข้อยกเว้นระดับทั้ง repo
#
# ต้องใช้อย่างประหยัดและอธิบายเหตุผลเสมอ ทุกบรรทัดที่เพิ่มตรงนี้คือการลดการป้องกันลง
# ---------------------------------------------------------------------------

[allowlist]
description = "ข้อยกเว้นของ repo ตัวอย่างนี้"

paths = [
  # เอกสารในแล็บนี้จำเป็นต้องยกตัวอย่างค่าลับปลอมให้ดู
  '''docs/.*\.md''',
  '''README\.md''',
  # ไฟล์คอนฟิกของตัวเครื่องมือเองมี regex ที่หน้าตาเหมือนค่าลับ
  '''\.gitleaks\.toml''',
  # ไฟล์ตัวอย่าง env ที่ไม่มีค่าจริง
  '''\.env\.example''',
]

regexes = [
  # ค่าที่ใช้เฉพาะตอนรันเทส
  '''test-token''',
]
