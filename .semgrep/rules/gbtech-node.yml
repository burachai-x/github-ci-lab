# กฎ SAST ที่เขียนเองสำหรับข้อตกลงภายในทีม
#
# กฎสำเร็จรูปจาก registry ครอบคลุมช่องโหว่ที่รู้จักกันทั่วไปอยู่แล้ว
# ส่วนไฟล์นี้ไว้ใส่ "กติกาของบ้านเรา" ที่เครื่องมือภายนอกไม่มีทางรู้
rules:
  - id: gbtech-exec-with-interpolation
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      ห้ามประกอบคำสั่ง shell ด้วยการแทรกตัวแปร (command injection)
      ให้ใช้ execFile/spawn แล้วส่ง argument เป็น array แทน
    metadata:
      category: security
      cwe: 'CWE-78: OS Command Injection'
      owasp: 'A03:2021 - Injection'
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $CP.exec(`...${$X}...`, ...)
          - pattern: $CP.execSync(`...${$X}...`, ...)
          - pattern: $CP.exec($A + $B, ...)
          - pattern: $CP.execSync($A + $B, ...)

  - id: gbtech-response-without-status-guard
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      ส่ง error object ของระบบกลับไปให้ผู้ใช้โดยตรง เสี่ยงหลุดข้อมูลภายใน
      (ชื่อไฟล์, โครงสร้างฐานข้อมูล, stack trace) ให้ส่งข้อความที่สรุปแล้วแทน
    metadata:
      category: security
      cwe: 'CWE-209: Generation of Error Message Containing Sensitive Information'
      confidence: MEDIUM
    pattern-either:
      - pattern: '$RES.json({..., error: $ERR.stack, ...})'
      - pattern: $RES.send($ERR.stack)

  - id: gbtech-hardcoded-credential-in-source
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      พบค่าที่ดูเหมือนรหัสผ่าน/โทเคนเขียนติดอยู่ในซอร์ส
      ให้ย้ายไปอ่านจาก process.env แล้วเก็บค่าจริงไว้ใน secret manager
    metadata:
      category: security
      cwe: 'CWE-798: Use of Hard-coded Credentials'
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: const $NAME = "..."
          - pattern: let $NAME = "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(password|passwd|secret|api_?key|token|credential).*
      - pattern-not: const $NAME = ""
      - pattern-not-inside: |
          process.env.$ANY

  - id: gbtech-path-from-user-input
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      นำค่าที่รับมาจากผู้ใช้ไปประกอบเป็น path ของไฟล์โดยตรง (path traversal)
      ผู้ใช้ส่ง ../../etc/passwd มาอ่านไฟล์นอกโฟลเดอร์ที่ตั้งใจได้
      ให้ตรวจชื่อไฟล์ด้วย allowlist หรือ path.basename() ก่อนเสมอ
    metadata:
      category: security
      cwe: 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory'
      owasp: 'A01:2021 - Broken Access Control'
      confidence: MEDIUM
    mode: taint
    pattern-sources:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
    pattern-sinks:
      - pattern: path.join(...)
      - pattern: path.resolve(...)
      - pattern: readFileSync(...)
      - pattern: readFile(...)
      - pattern: createReadStream(...)

  - id: gbtech-weak-hash-algorithm
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      ใช้อัลกอริทึม hash ที่ถือว่าอ่อนแล้ว (MD5/SHA1) กับข้อมูลที่ต้องการความปลอดภัย
      สำหรับรหัสผ่านให้ใช้ bcrypt/argon2 ส่วนงานตรวจความถูกต้องของข้อมูลให้ใช้ SHA-256 ขึ้นไป
    metadata:
      category: security
      cwe: 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      owasp: 'A02:2021 - Cryptographic Failures'
      confidence: HIGH
    pattern-either:
      - pattern: createHash("md5")
      - pattern: createHash("sha1")
      - pattern: $CRYPTO.createHash("md5")
      - pattern: $CRYPTO.createHash("sha1")
