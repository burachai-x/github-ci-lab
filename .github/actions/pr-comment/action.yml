# composite action: เอาผลสรุปของแต่ละด่านไปคอมเมนต์ไว้ใน Pull Request
#
# ทำไมต้องมี: หน้า Summary ของ workflow run สวยก็จริง แต่คนรีวิวต้องกดออกจาก PR
# ไปอีกหลายคลิกถึงจะเห็น เสียงเตือนที่ดีต้องไปอยู่ตรงที่คนทำงานอยู่ — ซึ่งก็คือหน้า PR
#
# กันคอมเมนต์ท่วม PR ด้วยการใช้ "marker" ซ่อนไว้ในคอมเมนต์ (sticky comment)
# ถ้ามีคอมเมนต์ของด่านนั้นอยู่แล้ว จะแก้ของเดิมแทนการสร้างใหม่
# push 10 ครั้งก็ยังมีคอมเมนต์ของด่านนั้นแค่ใบเดียวที่เนื้อหาเป็นปัจจุบันเสมอ

name: รายงานผลลง Pull Request
description: อัปเดตคอมเมนต์สรุปผลของด่านตรวจหนึ่ง ๆ ในหน้า Pull Request

inputs:
  key:
    description: ชื่อเฉพาะของด่าน ใช้เป็น marker เพื่อหาคอมเมนต์เดิมให้เจอ
    required: true
  report-file:
    description: ไฟล์ Markdown ที่จะเอาไปใส่ในคอมเมนต์
    required: true
  github-token:
    description: token ที่ใช้เขียนคอมเมนต์
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      # ส่งค่า input ผ่าน env แทนการแทรก ${{ }} ลงไปในตัว script โดยตรง
      # เพราะการแทรกค่าลงในโค้ดคือช่องทาง script injection แบบเดียวกับ SQL injection
      # (ด่าน SAST ของ repo นี้เองเป็นคนจับข้อนี้ได้ — ดู docs/03-sast.md)
      env:
        REPORT_KEY: ${{ inputs.key }}
        REPORT_FILE: ${{ inputs['report-file'] }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const key = process.env.REPORT_KEY;
          const file = process.env.REPORT_FILE;

          if (!context.payload.pull_request) {
            core.info('ไม่ได้อยู่ในบริบทของ Pull Request — ข้ามการคอมเมนต์');
            return;
          }
          if (!fs.existsSync(file)) {
            core.info(`ไม่พบไฟล์รายงาน ${file} — ข้ามการคอมเมนต์`);
            return;
          }

          const marker = `<!-- ci-lab-report:${key} -->`;
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = [
            marker,
            fs.readFileSync(file, 'utf8').trim(),
            '',
            `<sub>อัปเดตอัตโนมัติจาก [workflow run](${runUrl}) · commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\`</sub>`,
          ].join('\n');

          const prNumber = context.payload.pull_request.number;

          try {
            // หาคอมเมนต์เดิมของด่านนี้จาก marker
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              core.info(`อัปเดตคอมเมนต์เดิม (id=${existing.id})`);
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber, body });
              core.info('สร้างคอมเมนต์ใหม่');
            }
          } catch (error) {
            // PR ที่เปิดจาก fork จะได้ token แบบอ่านอย่างเดียว เขียนคอมเมนต์ไม่ได้
            // กรณีนี้ต้องไม่ทำให้ทั้ง job พัง เพราะผลการตรวจยังอยู่ครบในหน้า Summary
            core.warning(`คอมเมนต์ลง PR ไม่สำเร็จ (${error.message}) — ดูผลได้ที่หน้า Summary ของ run นี้`);
          }
