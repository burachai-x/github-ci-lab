# ด่านที่ 2 — Secret Scanning
#
# ตอบคำถามว่า "มีรหัสผ่าน / API key / โทเคน หลุดเข้ามาใน repo ไหม"
#
# ด่านนี้คุ้มค่าที่สุดต่อแรงที่ลง เพราะค่าลับที่หลุดขึ้น GitHub แม้เพียงไม่กี่นาที
# ต้องถือว่า "รั่วแล้ว" ต้องหมุนค่าใหม่ทั้งหมด การลบ commit ทิ้งไม่ช่วยอะไร
#
# repo นี้ใช้สองชั้นทับกัน
#   ชั้นที่ 1 (ของ GitHub) Secret Scanning + Push Protection — บล็อกตั้งแต่ตอน git push
#   ชั้นที่ 2 (ของเรา)      Gitleaks ใน CI — จับ pattern ของระบบภายในที่ GitHub ไม่รู้จัก

name: 2) Secret Scanning

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * 1' # ตรวจย้อนประวัติทั้งหมดทุกเช้าวันจันทร์
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # ใช้คอมเมนต์สรุปผลลงใน PR
  security-events: write

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # ตรึงเวอร์ชันของเครื่องมือไว้ ไม่ใช้ "latest"
  # เพื่อให้ผลการตรวจของวันนี้กับพรุ่งนี้เหมือนกัน และกันกรณี release ใหม่ถูกแก้ไขโดยไม่ตั้งใจ
  GITLEAKS_VERSION: 8.30.1

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: เช็คเอาต์โค้ดพร้อมประวัติทั้งหมด
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 = ดึงประวัติทุก commit มาด้วย
          # จำเป็น เพราะค่าลับที่ถูกลบออกจากไฟล์ไปแล้ว ยังนอนอยู่ในประวัติ git เสมอ
          fetch-depth: 0

      - name: ติดตั้ง Gitleaks (พร้อมตรวจ checksum)
        run: |
          set -euo pipefail
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "${BASE}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          # ตรวจว่าไฟล์ที่โหลดมาเป็นไฟล์เดียวกับที่ผู้พัฒนาปล่อยออกมาจริง
          # (เครื่องมือความปลอดภัยเองก็เป็นช่องทางโจมตี supply chain ได้)
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | sed "s|gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz|gitleaks.tar.gz|" | sha256sum -c -

          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # ---- การตรวจชั้นที่ 1: ไฟล์ที่มีอยู่ตอนนี้ ----
      - name: ตรวจไฟล์ปัจจุบัน
        id: worktree
        continue-on-error: true
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks-worktree.sarif \
            --redact \
            --no-banner \
            --log-level info

      # ---- การตรวจชั้นที่ 2: ประวัติ git ----
      # ใน PR ตรวจเฉพาะ commit ที่เพิ่มเข้ามาใหม่ (เร็วและตรงประเด็น)
      # ส่วนบน main และรอบ schedule ตรวจย้อนทั้งประวัติ
      - name: ตรวจประวัติ git
        id: history
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            echo "ตรวจเฉพาะ commit ใหม่: ${BASE_SHA}..HEAD"
            LOG_OPTS="${BASE_SHA}..HEAD"
          else
            echo "ตรวจประวัติทั้งหมด"
            LOG_OPTS="--all"
          fi

          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="${LOG_OPTS}" \
            --report-format json \
            --report-path gitleaks-history.json \
            --redact \
            --no-banner

      - name: ส่งผลเข้าแท็บ Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-worktree.sarif
          category: gitleaks

      - name: เก็บรายงานไว้เป็น artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-reports
          path: |
            gitleaks-worktree.sarif
            gitleaks-history.json
          if-no-files-found: ignore
          retention-days: 7

      - name: สรุปผลและตัดสินว่าผ่านหรือไม่
        if: always()
        run: |
          set -uo pipefail
          WORKTREE_COUNT=$(jq '[.runs[].results[]] | length' gitleaks-worktree.sarif 2>/dev/null || echo 0)
          HISTORY_COUNT=$(jq 'length' gitleaks-history.json 2>/dev/null || echo 0)

          {
            echo "## 🔑 ด่านที่ 2 — Secret Scanning (Gitleaks)"
            echo ""
            echo "| ขอบเขตการตรวจ | จำนวนที่เจอ |"
            echo "|----------------|-------------|"
            echo "| ไฟล์ปัจจุบันใน repo | ${WORKTREE_COUNT} |"
            echo "| ประวัติ git | ${HISTORY_COUNT} |"
            echo ""
          } | tee -a report.md >> "$GITHUB_STEP_SUMMARY"

          if [ "${WORKTREE_COUNT}" -gt 0 ]; then
            {
              echo "### รายการที่เจอในไฟล์ปัจจุบัน"
              echo ""
              echo "| ไฟล์ | บรรทัด | กฎที่จับได้ |"
              echo "|------|--------|-------------|"
              jq -r '.runs[].results[] | "| `\(.locations[0].physicalLocation.artifactLocation.uri)` | \(.locations[0].physicalLocation.region.startLine) | \(.ruleId) |"' gitleaks-worktree.sarif
              echo ""
            } | tee -a report.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${WORKTREE_COUNT}" -gt 0 ] || [ "${HISTORY_COUNT}" -gt 0 ]; then
            {
              echo "> [!CAUTION]"
              echo "> **เจอค่าลับในโค้ด — ถือว่าค่านั้นรั่วแล้ว**"
              echo ""
              echo "ลำดับการแก้ที่ถูกต้อง"
              echo ""
              echo "1. **เพิกถอนและออกค่าใหม่ก่อนเสมอ** (rotate) — สำคัญกว่าการลบไฟล์"
              echo "2. ย้ายค่าไปไว้ใน GitHub Actions secrets / secret manager แล้วอ่านผ่าน environment variable"
              echo "3. ลบค่าออกจากโค้ด และเพิ่มไฟล์ลง \`.gitignore\`"
              echo "4. ถ้าค่าอยู่ในประวัติ git ให้ล้างด้วย \`git filter-repo\` แล้วแจ้งทุกคนให้ clone ใหม่"
              echo ""
              echo "ถ้าตรวจแล้วเป็น false positive ให้เพิ่มข้อยกเว้นใน \`.gitleaks.toml\` **พร้อมคอมเมนต์อธิบายเหตุผล**"
            } | tee -a report.md >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "> [!TIP]" | tee -a report.md >> "$GITHUB_STEP_SUMMARY"
          echo "> ไม่พบค่าลับทั้งในไฟล์ปัจจุบันและในประวัติ ✅" | tee -a report.md >> "$GITHUB_STEP_SUMMARY"

      - name: คอมเมนต์สรุปผลลงใน Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: ./.github/actions/pr-comment
        with:
          key: secret-scan
          report-file: report.md
